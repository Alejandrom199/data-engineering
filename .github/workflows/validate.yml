name: Validate registry
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this registry
        uses: actions/checkout@v4
      - name: Checkout OpenLearn
        uses: actions/checkout@v4
        with:
          repository: alenj0x1/open-learn
          path: open-learn
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install OpenLearn dependencies
        working-directory: open-learn
        run: npm ci
      - name: Build @open-learn/shared
        working-directory: open-learn
        run: npm run build:shared
      - name: Validate this registry
        working-directory: open-learn
        run: npm run content:registry -- --root "$GITHUB_WORKSPACE" --check
